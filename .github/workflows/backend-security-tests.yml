name: Backend security tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-security-tests.yml"
  push:
    branches:
      - main
      - security/authenticated-payment-intent
    paths:
      - "backend/**"
      - ".github/workflows/backend-security-tests.yml"

jobs:
  security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run security tests
        env:
          DATABASE_URL: sqlite:///./ci_bilpay.db
          BILPAY_JWT_SECRET: ci-only-secret-that-is-long-enough-123456
          BILPAY_TEST_MODE: "true"
        run: pytest -q
