name: Build BilPay Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable debug APK
        run: gradle --no-daemon -PBILPAY_API_BASE_URL="${{ vars.BILPAY_API_BASE_URL }}" assembleDebug
      - name: Verify APK file
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
      - name: Upload BilPay APK
        uses: actions/upload-artifact@v4
        with:
          name: BilPay-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
