name: Build BilPay Signed Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilpay-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate permanent BilPay release key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BILPAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BILPAY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BILPAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BILPAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret for ${name}. Check all four BilPay signing secrets."
              exit 1
            fi
          done

          # Diagnose encoding without ever printing the secret itself.
          CLEAN_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          B64_LENGTH="${#CLEAN_B64}"
          echo "Keystore Base64 character count: $B64_LENGTH"
          if (( B64_LENGTH == 0 )); then
            echo "::error::The keystore secret is empty after whitespace removal."
            exit 1
          fi
          if [[ ! "$CLEAN_B64" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]; then
            echo "::error::The keystore secret contains characters outside standard Base64. Re-copy the complete .jks.base64 content."
            exit 1
          fi
          if (( B64_LENGTH % 4 != 0 )); then
            echo "::error::The keystore Base64 length is not divisible by 4; the GitHub Secret is truncated or incomplete."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/bilpay-signing"
          KEYSTORE="$RUNNER_TEMP/bilpay-signing/bilpay-release.jks"
          printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE"
          DECODED_SIZE="$(wc -c < "$KEYSTORE" | tr -d '[:space:]')"
          echo "Decoded keystore byte count: $DECODED_SIZE"
          if (( DECODED_SIZE < 1000 )); then
            echo "::error::Decoded keystore is unexpectedly small; the GitHub Secret may be incomplete."
            exit 1
          fi
          keytool -list -storetype JKS -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" >/dev/null
          keytool -list -storetype JKS -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -importkeystore -noprompt \
            -srckeystore "$KEYSTORE" -srcstoretype JKS -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/bilpay-signing/key-check.p12" -deststoretype PKCS12 \
            -deststorepass "temporary-validation-only" -destkeypass "temporary-validation-only" >/dev/null
          echo "Permanent BilPay keystore, alias, and private-key password are valid."

      - name: Build signed release APK
        env:
          BILPAY_KEYSTORE_PATH: ${{ runner.temp }}/bilpay-signing/bilpay-release.jks
          BILPAY_KEYSTORE_TYPE: JKS
          BILPAY_STORE_PASSWORD: ${{ secrets.BILPAY_STORE_PASSWORD }}
          BILPAY_KEY_ALIAS: ${{ secrets.BILPAY_KEY_ALIAS }}
          BILPAY_KEY_PASSWORD: ${{ secrets.BILPAY_KEY_PASSWORD }}
        run: gradle --no-daemon -PBILPAY_API_BASE_URL="https://bilpay-api-5b57.onrender.com" assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          ls -lh "$APK"

      - name: Upload BilPay permanent signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BilPay-Android-Permanent-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
