name: BilPay staging smoke test
on:
  push:
    branches:
      - feat/sandbox-internal-wallet
    paths:
      - "backend/**"
      - ".github/workflows/bilpay-staging-smoke.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify isolated staging API
        env:
          BASE_URL: https://bilpay-sandbox-api-v2.onrender.com
        run: |
          python - <<'PY'
          import json, os, secrets, urllib.request, urllib.error
          base = os.environ["BASE_URL"].rstrip("/")
          def request(method, path, payload=None, token=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode()
                  try: parsed = json.loads(body)
                  except Exception: parsed = {"raw": body}
                  return exc.code, parsed

          code, health = request("GET", "/health")
          assert code == 200 and health.get("ok") is True, (code, health)
          code, status = request("GET", "/api/v1/sandbox/status")
          assert code == 200 and status.get("sandbox_enabled") is True, (code, status)
          assert status.get("live_wallet_enabled") is False, status

          phone = "017" + str(secrets.randbelow(100_000_000)).zfill(8)
          code, account = request("POST", "/api/v1/auth/register", {
              "phone": phone, "password": "Staging-Only-Password-123", "full_name": "Staging Smoke"
          })
          assert code == 200 and account.get("access_token"), (code, account)
          token = account["access_token"]

          code, wallet = request("GET", "/api/v1/sandbox/wallet", token=token)
          assert code == 200 and wallet.get("mode") == "SANDBOX", (code, wallet)
          assert wallet.get("real_money") is False and wallet.get("redeemable") is False, wallet

          code, live = request("GET", "/api/v1/wallet", token=token)
          assert code == 503 and live.get("detail", {}).get("code") == "LIVE_LEDGER_NOT_CONFIGURED", (code, live)
          print("PASS: staging API healthy; sandbox wallet isolated; live wallet remains disabled.")
          PY
