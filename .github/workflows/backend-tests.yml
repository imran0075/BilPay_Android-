name: BilPay backend tests

on:
  push:
    branches:
      - feat/sandbox-internal-wallet
  pull_request:
    branches:
      - feat/sandbox-internal-wallet

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

          DATABASE_URL: sqlite:///./test_bilpay_ci.db
          BILPAY_JWT_SECRET: test-only-secret-that-is-long-enough-123456
          BILPAY_TEST_MODE: "true"
        run: pytest -q
