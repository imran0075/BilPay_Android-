name: Build BilPay Sandbox APK with permanent signing key
on:
  push:
    branches:
      - feat/android-sandbox-admin-grant

permissions:
  contents: read

jobs:
  build-sandbox-signed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate permanent BilPay signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BILPAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BILPAY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BILPAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BILPAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing BilPay signing secret: ${name}"
              exit 1
            fi
          done
          CLEAN_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          if [[ ! "$CLEAN_B64" =~ ^[A-Za-z0-9+/]*={0,2}$ ]] || (( ${#CLEAN_B64} == 0 || ${#CLEAN_B64} % 4 != 0 )); then
            echo "::error::Invalid BilPay keystore Base64"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bilpay-signing"
          KEYSTORE="$RUNNER_TEMP/bilpay-signing/bilpay-release.jks"
          printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE"
          if (( $(wc -c < "$KEYSTORE") < 1000 )); then
            echo "::error::BilPay keystore file is unexpectedly small"
            exit 1
          fi
          keytool -list -storetype JKS -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -importkeystore -noprompt -srckeystore "$KEYSTORE" -srcstoretype JKS -srcstorepass "$STORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" -destkeystore "$RUNNER_TEMP/bilpay-signing/key-check.p12" -deststoretype PKCS12 -deststorepass "temporary-validation-only" -destkeypass "temporary-validation-only" >/dev/null
          echo "BilPay signing key and alias validated."

      - name: Build Sandbox APK signed with permanent BilPay key
        env:
          BILPAY_KEYSTORE_PATH: ${{ runner.temp }}/bilpay-signing/bilpay-release.jks
          BILPAY_KEYSTORE_TYPE: JKS
          BILPAY_STORE_PASSWORD: ${{ secrets.BILPAY_STORE_PASSWORD }}
          BILPAY_KEY_ALIAS: ${{ secrets.BILPAY_KEY_ALIAS }}
          BILPAY_KEY_PASSWORD: ${{ secrets.BILPAY_KEY_PASSWORD }}
        run: gradle --no-daemon -PBILPAY_API_BASE_URL="https://bilpay-sandbox-api-v2.onrender.com" assembleRelease

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload signed Sandbox APK
        uses: actions/upload-artifact@v4
        with:
          name: BilPay-Sandbox-Permanent-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
