name: BPay Agent Cash In Backend Tests

on:
  push:
    branches: ["feature/web-admin-agent-cashin"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:///./test_bilpay_internal_wallet.db
          BILPAY_JWT_SECRET: test-only-secret-that-is-long-enough-123456
        run: pytest -q tests/test_internal_wallet.py
